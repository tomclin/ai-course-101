<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>AGENT = MODEL + HARNESS — 課程涵蓋地圖</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light dark;
    --paper:#F7F6F2;
    --surface:#FFFFFF;
    --ink:#17263B;
    --muted:#3D4A5C;
    --faint:#677180;
    --teal:#2E7D6B;
    --seal:#B5432E;
    --hair:#D9D6CE;
    --on-accent:#FDFBF7;
    --wash:#EDF3F1;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#14181F;
      --surface:#1C222B;
      --ink:#E8E5DE;
      --muted:#B4BCC7;
      --faint:#87919D;
      --teal:#4FA893;
      --seal:#D4664F;
      --hair:#2A3038;
      --on-accent:#16100E;
      --wash:#1A2420;
    }
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--paper);}
  body{
    color:var(--ink);
    font-family:'Noto Sans TC',sans-serif;
    padding:36px 18px 56px;
  }
  .page{max-width:980px;margin:0 auto;}
  svg{width:100%;height:auto;display:block;}
  text{font-family:'Noto Sans TC',sans-serif;fill:var(--ink);}
  .t-900{font-weight:900;}
  .t-700{font-weight:700;}
  .t-500{font-weight:500;fill:var(--muted);}
  .t-cap{font-weight:500;fill:var(--muted);}
  .t-faint{font-weight:400;fill:var(--faint);}
  .t-teal{fill:var(--teal);font-weight:700;}
  .t-seal{fill:var(--seal);font-weight:700;}
  .t-onaccent{fill:var(--on-accent);}
  .t-tag{fill:var(--muted);font-weight:500;}
  .box-thin{fill:none;stroke:var(--muted);stroke-width:1.5;}
  .box-thick{fill:none;stroke:var(--ink);stroke-width:4.5;}
  .box-model{fill:var(--teal);stroke:none;}
  .box-gov{fill:none;stroke:var(--seal);stroke-width:4.5;}
  .frame{fill:none;stroke:var(--muted);stroke-width:1.5;}
  .tag-pill{fill:var(--wash);stroke:var(--hair);stroke-width:1;}
  .arrow{stroke:var(--ink);stroke-width:1.8;fill:none;}
  .arrow-seal{stroke:var(--seal);stroke-width:1.8;fill:none;stroke-dasharray:5 4;}
  .hairline{stroke:var(--hair);stroke-width:1;}
</style>
</head>
<body>
<div class="page">
<svg viewBox="0 0 980 1172" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agent = Model + Harness 課程涵蓋地圖">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="var(--ink)"/>
    </marker>
    <marker id="ahs" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="var(--seal)"/>
    </marker>
  </defs>

  <!-- ===== Title block ===== -->
  <text x="490" y="54" text-anchor="middle" class="t-900" font-size="34" letter-spacing="2">AGENT ＝ MODEL ＋ HARNESS</text>
  <text x="490" y="82" text-anchor="middle" class="t-teal" font-size="15">課程涵蓋地圖 · 也是『什麼是 Harness』的一張圖</text>
  <text x="490" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="var(--seal)">吞併地圖：哪些格子會被模型吞進去，哪些永遠留在外面</text>
  <text x="490" y="130" text-anchor="middle" class="t-cap" font-size="12">每格標的是我們哪一堂課碰觸這個主題——三堂課合起來，就是一整個 Agent。</text>

  <!-- ===== Loop container (harness runtime) ===== -->
  <rect x="330" y="150" width="310" height="471" rx="18" class="frame"/>
  <text x="485" y="178" text-anchor="middle" class="t-faint" font-size="11.5">迴圈＝純程式碼，不思考（思考只在 Reason 這格）</text>

  <!-- Context -->
  <rect x="375" y="205" width="220" height="62" rx="12" class="box-thin"/>
  <text x="485" y="232" text-anchor="middle" class="t-700" font-size="18">Context 脈絡</text>
  <text x="485" y="253" text-anchor="middle" class="t-cap" font-size="11.5">組裝技藝被吞併；素材留下</text>
  <rect x="529" y="271" width="66" height="16" rx="8" class="tag-pill"/>
  <text x="562" y="282.5" text-anchor="middle" class="t-tag" font-size="10">101 · 103</text>

  <!-- arrow -->
  <line x1="485" y1="267" x2="485" y2="298" class="arrow" marker-end="url(#ah)"/>

  <!-- Observe (no course tag) -->
  <rect x="375" y="305" width="220" height="62" rx="12" class="box-thin"/>
  <text x="485" y="332" text-anchor="middle" class="t-700" font-size="18">Observe 觀察</text>
  <text x="485" y="353" text-anchor="middle" class="t-cap" font-size="11.5">整理回饋，漸成原生能力</text>

  <line x1="485" y1="367" x2="485" y2="398" class="arrow" marker-end="url(#ah)"/>

  <!-- Reason = MODEL -->
  <rect x="375" y="405" width="220" height="76" rx="12" class="box-model"/>
  <text x="485" y="437" text-anchor="middle" class="t-900 t-onaccent" font-size="19">Reason 推理</text>
  <text x="485" y="460" text-anchor="middle" class="t-onaccent" font-size="11.5" font-weight="500" opacity="0.9">唯一的 Model；其餘皆 Harness</text>
  <rect x="529" y="485" width="44" height="16" rx="8" class="tag-pill"/>
  <text x="551" y="496.5" text-anchor="middle" class="t-tag" font-size="10">103</text>

  <line x1="485" y1="481" x2="485" y2="512" class="arrow" marker-end="url(#ah)"/>

  <!-- Act -->
  <rect x="375" y="519" width="220" height="62" rx="12" class="box-thin"/>
  <text x="485" y="546" text-anchor="middle" class="t-700" font-size="18">Act 行動</text>
  <text x="485" y="567" text-anchor="middle" class="t-cap" font-size="11.5">決策被吞併　動手連工具</text>
  <rect x="529" y="585" width="44" height="16" rx="8" class="tag-pill"/>
  <text x="551" y="596.5" text-anchor="middle" class="t-tag" font-size="10">102</text>

  <!-- loop back arrow -->
  <path d="M 595 550 L 622 550 L 622 190 L 500 190" class="arrow" marker-end="url(#ah)"/>

  <!-- ===== Left column ===== -->
  <!-- Prompt (thick) -->
  <rect x="55" y="270" width="215" height="76" rx="12" class="box-thick"/>
  <text x="162" y="301" text-anchor="middle" class="t-900" font-size="18">Prompt 意圖</text>
  <text x="162" y="323" text-anchor="middle" class="t-cap" font-size="11.5">套路會過時；意圖只有你能給</text>
  <rect x="98" y="350" width="128" height="16" rx="8" class="tag-pill"/>
  <text x="162" y="361.5" text-anchor="middle" class="t-tag" font-size="10">貫穿三堂（你的圖紙）</text>
  <line x1="270" y1="308" x2="322" y2="308" class="arrow" marker-end="url(#ah)"/>

  <!-- Orchestration (thin) -->
  <rect x="55" y="470" width="215" height="76" rx="12" class="box-thin"/>
  <text x="162" y="501" text-anchor="middle" class="t-700" font-size="18">Orchestration 調度</text>
  <text x="162" y="523" text-anchor="middle" class="t-cap" font-size="11.5">規劃拆步，已被吞掉大半</text>
  <rect x="140" y="550" width="44" height="16" rx="8" class="tag-pill"/>
  <text x="162" y="561.5" text-anchor="middle" class="t-tag" font-size="10">102</text>
  <line x1="270" y1="508" x2="322" y2="508" class="arrow" marker-end="url(#ah)"/>

  <!-- ===== Right column ===== -->
  <!-- Tools & Skills (thick) -->
  <rect x="710" y="270" width="215" height="76" rx="12" class="box-thick"/>
  <text x="817" y="301" text-anchor="middle" class="t-900" font-size="18">Tools 工具之手</text>
  <text x="817" y="323" text-anchor="middle" class="t-cap" font-size="11.5">模型只會說；動手永遠在外</text>
  <rect x="795" y="350" width="44" height="16" rx="8" class="tag-pill"/>
  <text x="817" y="361.5" text-anchor="middle" class="t-tag" font-size="10">102</text>
  <line x1="648" y1="308" x2="702" y2="308" class="arrow" marker-end="url(#ah)"/>

  <!-- Security & Governance (thick seal) -->
  <rect x="710" y="470" width="215" height="76" rx="12" class="box-gov"/>
  <text x="817" y="501" text-anchor="middle" class="t-900" font-size="18">Security 與治理</text>
  <text x="817" y="523" text-anchor="middle" class="t-cap" font-size="11.5">裁判不住在球員身體裡</text>
  <rect x="712" y="550" width="66" height="16" rx="8" class="tag-pill"/>
  <text x="745" y="561.5" text-anchor="middle" class="t-tag" font-size="10">102 · 103</text>
  <line x1="648" y1="508" x2="702" y2="508" class="arrow" marker-end="url(#ah)"/>

  <!-- ===== Memory (bottom) ===== -->
  <line x1="485" y1="621" x2="485" y2="669" class="arrow" marker-end="url(#ah)"/>
  <rect x="360" y="677" width="250" height="80" rx="12" class="box-thick"/>
  <text x="485" y="709" text-anchor="middle" class="t-700" font-size="18">Memory 記憶</text>
  <text x="485" y="731" text-anchor="middle" class="t-cap" font-size="11.5">被模型吞併？技術走向 vs 商業需要</text>
  <rect x="463" y="761" width="44" height="16" rx="8" class="tag-pill"/>
  <text x="485" y="772.5" text-anchor="middle" class="t-tag" font-size="10">101</text>

  <!-- governance pull on memory -->
  <path d="M 817 546 L 817 717 L 618 717" class="arrow-seal" marker-end="url(#ahs)"/>
  <text x="715" y="699" text-anchor="middle" class="t-seal" font-size="12">雙重地板：經濟＋治理</text>
  <text x="770" y="741" text-anchor="middle" class="t-faint" font-size="11">企業端：① 重新訓練太貴太慢</text>
  <text x="770" y="759" text-anchor="middle" class="t-faint" font-size="11">② 記憶進權重＝不可審計／不可攜／不可刪</text>
  <text x="485" y="795" text-anchor="middle" class="t-faint" font-size="11">消費端：內建記憶正把這一格往模型裡吸；企業端：雙重地板把它守在外——兩股力同時為真</text>

  <!-- ===== Legend ===== -->
  <line x1="70" y1="811" x2="910" y2="811" class="hairline"/>
  <text x="70" y="847" class="t-700" font-size="14">圖例</text>

  <rect x="70" y="867" width="54" height="30" rx="8" class="box-model"/>
  <text x="140" y="887" class="t-500" font-size="13">模型本身——全圖唯一會思考的格子</text>

  <rect x="70" y="913" width="54" height="30" rx="8" class="box-thin"/>
  <text x="140" y="933" class="t-500" font-size="13">細框：正在或可能被模型吞併——鷹架，該建就建、該拆就拆</text>

  <rect x="70" y="959" width="54" height="30" rx="8" class="box-thick"/>
  <text x="140" y="979" class="t-500" font-size="13">粗框：恆留模型之外——意圖、執行之手、治理；你的投資放這裡</text>

  <rect x="70" y="1005" width="54" height="30" rx="8" class="box-gov"/>
  <text x="140" y="1025" class="t-500" font-size="13">治理框：非技術護城河——不是技術保住它，是治理需求保住它</text>

  <rect x="70" y="1053" width="54" height="20" rx="8" class="tag-pill"/>
  <text x="97" y="1067" text-anchor="middle" class="t-tag" font-size="10">102</text>
  <text x="140" y="1069" class="t-500" font-size="13">課程標籤：標示這格由我們哪一堂課教（101 · 102 · 103）</text>

  <!-- ===== Credit ===== -->
  <text x="70" y="1117" class="t-faint" font-size="11">基本架構（八格 ＋ Context→Observe→Reason→Act 迴圈 ＋ Model／Harness 之分）參考 Jensen Huang（NVIDIA）於 GTC Taipei 2026（2026-06-01）演講所示的 Agentic 框架重繪。</text>
  <text x="70" y="1137" class="t-faint" font-size="11">吞併分析（細框／粗框／治理框）、鷹架／圖紙框架與所有中文註解，皆為本課程另加，非 Jensen 原述。 · 課程涵蓋地圖 · 2026.07</text>
  <text x="490" y="1161" text-anchor="middle" class="t-faint" font-size="11">© 2026 林中致 Tom Lin · 版權所有</text>
</svg>
</div>
</body>
</html>
